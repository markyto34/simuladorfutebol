name: Recuperação histórica Flashscore + Bwin

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "Data final (YYYY-MM-DD), máximo 14 dias incluindo as pontas"
        required: true
        type: string
      historical_odds_only:
        description: "Recolher apenas jogos que constam no CSV histórico completo de odds"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# Serializa com a recolha diária para evitar dois processos a escrever os mesmos CSV.
concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout histórico
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validar intervalo
        id: range
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          for value in "$START_DATE" "$END_DATE"; do
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ "$(date -u -d "$value" +%F 2>/dev/null || true)" != "$value" ]]; then
              echo "Data inválida: $value. Usa YYYY-MM-DD."
              exit 2
            fi
          done
          start_epoch=$(date -u -d "$START_DATE" +%s)
          end_epoch=$(date -u -d "$END_DATE" +%s)
          if (( end_epoch < start_epoch )); then
            echo "A data final não pode ser anterior à inicial."
            exit 2
          fi
          days=$(( (end_epoch - start_epoch) / 86400 + 1 ))
          if (( days > 14 )); then
            echo "Limite de segurança: máximo de 14 dias por execução; recebidos $days."
            exit 2
          fi
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Intervalo validado: $START_DATE a $END_DATE ($days dias)."

      - name: Recolher jogos dia a dia
        env:
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ steps.range.outputs.days }}
          FLASHSCORE_REQUEST_DELAY_MS: "1000"
          FLASHSCORE_CONCURRENCY: "2"
          HISTORICAL_ODDS_ONLY: ${{ inputs.historical_odds_only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          failures=0
          blocked=0
          for ((offset=0; offset<DAYS; offset++)); do
            day=$(date -u -d "$START_DATE + $offset days" +%F)
            echo "::group::Flashscore · $day"
            set +e
            if [[ "$HISTORICAL_ODDS_ONLY" == "true" ]]; then
              node scripts/collect-flashscore-csv.mjs --date="$day" --historical-odds 2>&1 | tee "/tmp/flashscore-$day.log"
            else
              node scripts/collect-flashscore-csv.mjs --date="$day" 2>&1 | tee "/tmp/flashscore-$day.log"
            fi
            code=${PIPESTATUS[0]}
            set -e
            if grep -Eiq 'HTTP (403|429)|respond(e|eu) HTTP (403|429)' "/tmp/flashscore-$day.log"; then
              echo "Flashscore bloqueou ou limitou pedidos em $day. A interromper para proteger a recolha."
              blocked=1
              echo "::endgroup::"
              break
            fi
            if (( code != 0 )); then
              failures=$((failures + 1))
              echo "Dia $day terminou com erros; o histórico recolhido e validável será preservado."
            fi
            echo "::endgroup::"
          done
          echo "Dias com erros: $failures" >> "$GITHUB_STEP_SUMMARY"
          echo "Interrompido por 403/429: $blocked" >> "$GITHUB_STEP_SUMMARY"
          if (( blocked == 1 )); then
            echo "Recolha interrompida preventivamente por limitação do Flashscore." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validar histórico completo
        run: |
          node scripts/validate-flashscore-history.mjs
          node scripts/integrate-flashscore-odds-history.mjs

      - name: Guardar CSVs sem substituir histórico
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv
          if git diff --cached --quiet; then
            echo "Sem alterações; histórico mantido."
          else
            git commit -m "Recuperar histórico Flashscore por intervalo de datas"
            git push origin main
          fi
