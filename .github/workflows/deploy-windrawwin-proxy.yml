name: Deploy WinDrawWin proxy

on:
  push:
    branches: [main]
    paths:
      - "windrawwin-proxy/**"
      - ".github/workflows/deploy-windrawwin-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windrawwin-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: windrawwin-proxy
