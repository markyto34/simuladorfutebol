name: Recolha diária Flashscore + Bwin

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data a recolher (YYYY-MM-DD). Por defeito, ontem em Portugal."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false

jobs:
  collect-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout histórico
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determinar data de recolha (Portugal)
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DATE:-}" ]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "A data deve estar no formato YYYY-MM-DD."
              exit 2
            fi
            TARGET_DATE="$REQUESTED_DATE"
          else
            TARGET_DATE="$(TZ=Europe/Lisbon date -d 'yesterday' +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Data a recolher: $TARGET_DATE"
      - name: Verificar scripts
        run: |
          node --check scripts/collect-flashscore-csv.mjs
          node --check scripts/validate-flashscore-history.mjs
      - name: Descobrir jogos e recolher estatísticas + odds Bwin
        id: collect
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          FLASHSCORE_REQUEST_DELAY_MS: "2500"
          MONITOR_URL: "https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev"
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node scripts/collect-flashscore-csv.mjs --date="$TARGET_DATE"
      - name: Validar histórico CSV
        id: validate
        if: always()
        run: node scripts/validate-flashscore-history.mjs
      - name: Guardar novos registos sem substituir histórico
        id: commit
        if: always() && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv
          if git diff --cached --quiet; then
            echo "Sem novos dados para guardar."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualização diária Flashscore e odds Bwin (${{ steps.date.outputs.target_date }})"
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assinalar falha de recolha
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A recolha diária teve falhas. Os dados válidos já recolhidos foram preservados se passaram a validação."
          exit 1

      - name: Atualizar estado final do monitor
        if: always()
        env:
          MONITOR_URL: "https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev"
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          if [ -z "${MONITOR_TOKEN:-}" ]; then
            echo "Monitor não configurado; a recolha prossegue normalmente."
            exit 0
          fi
          node --input-type=module <<'NODE'
          const base = process.env.MONITOR_URL;
          const headers = { "content-type": "application/json", "authorization": "Bearer " + process.env.MONITOR_TOKEN };
          const send = async (payload) => {
            try {
              const response = await fetch(base + "/monitor/update", { method: "POST", headers, body: JSON.stringify(payload) });
              if (!response.ok) console.error("Monitor respondeu HTTP " + response.status);
            } catch (error) { console.error("Monitor indisponível: " + error.message); }
          };
          await send({ type: "repository_commit", committed: process.env.COMMITTED === "true", commit_sha: process.env.GITHUB_SHA });
          const ok = process.env.COLLECT_OUTCOME === "success" && process.env.VALIDATE_OUTCOME === "success";
          await send({ type: "finished", status: ok ? "completed" : "partial", message: ok ? "Workflow concluído; validação terminada" : "Workflow terminou com falhas; consultar os logs", run_id: process.env.GITHUB_RUN_ID });
          NODE
