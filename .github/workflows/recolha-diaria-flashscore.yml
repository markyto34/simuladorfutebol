name: Recolha diária Flashscore + Bwin
run-name: Recolha Flashscore + Bwin · ${{ inputs.target_date || 'ontem (Portugal)' }}

on:
  schedule:
    - cron: "30 5 * * *"
    # Segunda oportunidade se o GitHub não iniciar o primeiro agendamento.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data a recolher (YYYY-MM-DD). Por defeito, ontem em Portugal."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false

jobs:
  collect-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout histórico
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Determinar data de recolha (Portugal)
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DATE:-}" ]; then
            if [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "A data deve estar no formato YYYY-MM-DD."
              exit 2
            fi
            TARGET_DATE="$REQUESTED_DATE"
          else
            TARGET_DATE="$(TZ=Europe/Lisbon date -d 'yesterday' +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Data a recolher: $TARGET_DATE"
      - name: Verificar scripts
        run: |
          node --check scripts/collect-flashscore-csv.mjs
          node --check scripts/validate-flashscore-history.mjs
          node --check scripts/integrate-flashscore-odds-history.mjs
          node --check scripts/audit-flashscore-catalog-coverage.mjs
          node --check scripts/update-simulator-complete-competitions.mjs
          node --test tests/update-simulator-complete-competitions.test.mjs
      - name: Descobrir jogos e recolher estatísticas + odds Bwin
        id: collect
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          FLASHSCORE_REQUEST_DELAY_MS: "300"
          FLASHSCORE_CONCURRENCY: "10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-flashscore-csv.mjs --date="$TARGET_DATE"
      - name: Validar histórico CSV
        id: validate
        if: always()
        run: node scripts/validate-flashscore-history.mjs
      - name: Atualizar auditoria de cobertura do catálogo
        if: always() && steps.validate.outcome == 'success'
        run: |
          if [ -f data/flashscore-competition-catalog.json ]; then
            node scripts/audit-flashscore-catalog-coverage.mjs
          else
            echo "Catálogo Flashscore ainda não publicado; auditoria adiada."
          fi
      - name: Integrar recolha no CSV histórico de odds
        if: always() && steps.validate.outcome == 'success'
        run: node scripts/integrate-flashscore-odds-history.mjs
      - name: Atualizar índice do simulador com as estatísticas guardadas
        if: always() && steps.validate.outcome == 'success'
        run: node scripts/update-simulator-complete-competitions.mjs
      - name: Guardar CSVs recolhidos e histórico atualizado
        if: always() && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-competition-coverage.json data/simulator-complete-competitions.json ganhonasodds_com_20261101.csv
          if git diff --cached --quiet; then
            echo "Sem novos dados para guardar."
          else
            git commit -m "Atualização diária Flashscore, Bwin e CSV histórico (${{ steps.date.outputs.target_date }})"
            # A main pode ter recebido um merge enquanto a recolha decorria.
            # Rebaseia o commit dos CSV sobre a versão mais recente antes de publicar.
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push recusado (tentativa ${attempt}/3); vou sincronizar novamente com main."
            done
            if [ "$pushed" != "true" ]; then
              echo "Não foi possível publicar os CSV após 3 tentativas."
              exit 1
            fi
          fi
      - name: Assinalar falha de recolha
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A recolha diária teve falhas. Os dados válidos já recolhidos foram preservados se passaram a validação."
          exit 1
