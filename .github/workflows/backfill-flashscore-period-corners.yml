name: Backfill histórico de cantos HT/ST Flashscore

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-flashscore-period-corners.mjs"
      - ".github/workflows/backfill-flashscore-period-corners.yml"
      - "data/force-flashscore-period-corners-backfill.once"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Flashscore proxy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false

jobs:
  backfill-period-corners:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout histórico
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Verificar marcador de backfill único
        id: marker
        run: |
          if [ -s data/force-flashscore-period-corners-backfill.once ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backfill histórico já concluído; nada a fazer."
          fi
      - name: Preparar Node
        if: steps.marker.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Ler e validar intervalo guardado
        if: steps.marker.outputs.exists == 'true'
        id: dates
        run: |
          set -euo pipefail
          START_DATE="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("data/force-flashscore-period-corners-backfill.once","utf8")); process.stdout.write(d.start_date)')"
          END_DATE="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("data/force-flashscore-period-corners-backfill.once","utf8")); process.stdout.write(d.end_date)')"
          for value in "$START_DATE" "$END_DATE"; do
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ "$(date -u -d "$value" +%F 2>/dev/null || true)" != "$value" ]]; then
              echo "Data inválida no marcador: $value"
              exit 2
            fi
          done
          start_epoch=$(date -u -d "$START_DATE" +%s)
          end_epoch=$(date -u -d "$END_DATE" +%s)
          if (( end_epoch < start_epoch )); then echo "Data final anterior à inicial."; exit 2; fi
          days=$(( (end_epoch - start_epoch) / 86400 + 1 ))
          if (( days > 31 )); then echo "Máximo de 31 dias por execução."; exit 2; fi
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "Intervalo histórico: $START_DATE a $END_DATE ($days dias)"
      - name: Confirmar proxy publicado e feed HT/ST disponível
        if: steps.marker.outputs.exists == 'true'
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/record?id=hW5lOaOP&tab=statistics" -o /tmp/period-corners.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/period-corners.json","utf8")); const r=d.record||{}; const ht=r.statistics?.corners_ht; const st=r.statistics?.corners_st; if(!d.ok || r.period_statistics_feed?.status!=="available" || !ht || !st || ![ht.home,ht.away,st.home,st.away].every(Number.isFinite)) { console.error(JSON.stringify({ok:d.ok,feed:r.period_statistics_feed,corners_ht:ht,corners_st:st})); process.exit(1); } console.log("Feed HT/ST confirmado antes do backfill.");'
      - name: Testar backfill
        if: steps.marker.outputs.exists == 'true'
        run: |
          node --check scripts/backfill-flashscore-period-corners.mjs
          node --test tests/backfill-flashscore-period-corners.test.mjs
      - name: Recolher cantos HT/ST em falta
        id: backfill
        if: steps.marker.outputs.exists == 'true'
        continue-on-error: true
        env:
          FLASHSCORE_REQUEST_DELAY_MS: "1000"
          FLASHSCORE_CONCURRENCY: "1"
        run: node scripts/backfill-flashscore-period-corners.mjs --start-date="${{ steps.dates.outputs.start_date }}" --end-date="${{ steps.dates.outputs.end_date }}"
      - name: Validar histórico e atualizar auditoria
        if: steps.marker.outputs.exists == 'true'
        run: |
          node scripts/validate-flashscore-history.mjs
          node scripts/audit-flashscore-catalog-coverage.mjs
      - name: Guardar dados válidos e concluir marcador apenas quando completo
        if: always() && steps.marker.outputs.exists == 'true'
        env:
          BACKFILL_OUTCOME: ${{ steps.backfill.outcome }}
        run: |
          set -euo pipefail
          if [ "$BACKFILL_OUTCOME" = "success" ]; then
            rm data/force-flashscore-period-corners-backfill.once
          else
            echo "O marcador fica ativo para a próxima tentativa automática; os valores válidos já recolhidos serão preservados."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashscore-statistics.csv data/flashscore-competition-coverage.json
          git add -u data/force-flashscore-period-corners-backfill.once 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Não havia novos valores HT/ST para guardar."
          else
            git commit -m "Backfill histórico de cantos HT e ST"
            git push origin HEAD:main
          fi
      - name: Assinalar falhas depois de guardar os valores válidos
        if: steps.marker.outputs.exists == 'true' && steps.backfill.outcome == 'failure'
        run: |
          echo "O backfill teve falhas ou foi limitado pelo Flashscore. Os dados válidos foram preservados e a próxima tentativa automática continuará apenas os jogos em falta."
          exit 1
