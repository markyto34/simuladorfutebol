name: Pilot team last-five collection queue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl-team-last-five-pilot.yml"
      - "scripts/crawl-flashscore-team-results.mjs"
      - "scripts/seed-flashscore-team-ids.mjs"
      - "scripts/build-historical-team-universe.mjs"
      - "scripts/collect-flashscore-csv.mjs"
      - "tests/collect-team-last-five.test.mjs"
      - "ganhonasodds_com_20261101.csv"
      - "data/flashscore-statistics.csv"
  workflow_dispatch:
    inputs:
      seed_limit:
        description: "Jogos de origem para descobrir IDs (0 = todos)"
        required: false
        default: "20"
      max_teams:
        description: "Máximo de feeds de equipas a consultar"
        required: false
        default: "40"
      delay_ms:
        description: "Intervalo entre pedidos ao Flashscore"
        required: false
        default: "1500"

concurrency:
  group: team-last-five-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build historical team universe
        run: node scripts/build-historical-team-universe.mjs --output=/tmp/historical-team-universe.json
      - name: Seed single pilot team (Sporting CP)
        run: |
          cat > /tmp/flashscore-team-id-seeds.json <<'JSON'
          {
            "teams": [
              {
                "team_id": "tljXuHBC",
                "team_name": "Sporting CP",
                "slug": "sporting-cp"
              }
            ]
          }
          JSON
      - name: Crawl team last-five feeds and deduplicate fixtures
        env:
          MAX_TEAMS: ${{ github.event.inputs.max_teams || '1' }}
          DELAY_MS: ${{ github.event.inputs.delay_ms || '1500' }}
        run: node scripts/crawl-flashscore-team-results.mjs --universe=/tmp/historical-team-universe.json --seeds=/tmp/flashscore-team-id-seeds.json --max-teams="$MAX_TEAMS" --delay-ms="$DELAY_MS" --output=/tmp/team-last-five-pilot.json
      - name: Collect stats for all pending unique fixtures
        env:
          FLASHSCORE_CONCURRENCY: "1"
          FLASHSCORE_REQUEST_DELAY_MS: "1500"
        run: node scripts/collect-flashscore-csv.mjs --team-last-five=/tmp/team-last-five-pilot.json
      - name: Upload collected stats CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-last-five-stats-pilot
          path: |
            data/flashscore-statistics.csv
            data/bwin-odds-flashscore.csv
          if-no-files-found: error
          retention-days: 14
      - name: Upload deduplicated last-five queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-last-five-pilot
          path: /tmp/team-last-five-pilot.json
          if-no-files-found: error
          retention-days: 14
