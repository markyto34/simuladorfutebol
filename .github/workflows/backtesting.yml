name: Backtesting do simulador Flashscore
on:
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - data-enrichment.js
      - metric-coverage.js
      - data/flashscore-statistics.csv
      - data/simulator-complete-competitions.json
      - scripts/backtest-flashscore-simulator.cjs
      - tests/backtest-flashscore-simulator.test.cjs
      - .github/workflows/backtesting.yml
  pull_request:
    paths:
      - app.js
      - index.html
      - data-enrichment.js
      - metric-coverage.js
      - data/flashscore-statistics.csv
      - data/simulator-complete-competitions.json
      - scripts/backtest-flashscore-simulator.cjs
      - tests/backtest-flashscore-simulator.test.cjs
      - .github/workflows/backtesting.yml
  workflow_dispatch:
    inputs:
      sample_size:
        description: Número de jogos anteriores por equipa e indicador
        required: false
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
  schedule:
    - cron: "30 5 * * 1"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMPLE_SIZE: ${{ inputs.sample_size || '5' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar motor de backtesting
        run: |
          node -c scripts/backtest-flashscore-simulator.cjs
          node --test tests/backtest*.test.cjs
      - name: Executar walk-forward sobre o histórico Flashscore
        run: node scripts/backtest-flashscore-simulator.cjs data/flashscore-statistics.csv "$SAMPLE_SIZE" data/simulator-complete-competitions.json backtest-flashscore-report.json
      - name: Publicar relatório
        uses: actions/upload-artifact@v6
        with:
          name: backtest-flashscore-simulator
          path: backtest-flashscore-report.json
          if-no-files-found: error
