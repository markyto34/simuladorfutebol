name: Backfill Flashscore — continuar desde Turquia
on:
  workflow_dispatch:
    inputs:
      competition_path:
        description: "Opcional: executar apenas uma competição selecionada."
        required: false
        type: string
      country_slug:
        description: "Opcional: filtrar por país/região (ex.: portugal, brasil, africa)."
        required: false
        default: ""
        type: string
      resume_from_path:
        description: "Retomar incluindo esta competição pendente."
        required: false
        default: ""
        type: string
      resume_after_path:
        description: "Cursor estável: continuar depois deste caminho."
        required: false
        default: ""
        type: string
      competition_limit:
        description: "Máximo por execução: entre 1 e 25. Recomendado: 15."
        required: false
        default: "15"
        type: string
permissions:
  contents: write
concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar e testar descoberta
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
          RESUME_FROM_PATH: ${{ inputs.resume_from_path }}
          RESUME_AFTER_PATH: ${{ inputs.resume_after_path }}
        run: |
          set -euo pipefail
          if [[ -n "$COMPETITION_PATH" || -n "$RESUME_FROM_PATH" ]]; then
            for candidate in "$COMPETITION_PATH" "$RESUME_FROM_PATH"; do
              [[ -n "$candidate" ]] || continue
              [[ "$candidate" =~ ^/futebol/[a-z0-9-]+/[a-z0-9-]+/$ ]] || {
                echo "Caminho inválido: $candidate. Usa /futebol/<pais>/<competicao>/."
                exit 2
              }
              if [[ "$candidate" =~ friendly|friendlies|amig[aá]v|amistos ]]; then
                echo "Competições amigáveis estão excluídas."
                exit 2
              fi
            done
          fi
          node --check scripts/discover-flashscore-season.mjs
          node --check scripts/build-flashscore-competition-status.mjs
          node --check scripts/select-flashscore-backfill-paths.mjs
          node --check scripts/split-flashscore-season-manifest.mjs
          node --test tests/discover-flashscore-season.test.mjs tests/build-flashscore-competition-status.test.mjs tests/select-flashscore-backfill-paths.test.mjs tests/collect-team-last-five.test.mjs
      - name: Preparar lote seguro de competições selecionadas
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
          COUNTRY_SLUG: ${{ inputs.country_slug }}
          RESUME_FROM_PATH: ${{ inputs.resume_from_path }}
          RESUME_AFTER_PATH: ${{ inputs.resume_after_path }}
          COMPETITION_LIMIT: ${{ inputs.competition_limit }}
        run: |
          set -euo pipefail
          node scripts/build-flashscore-competition-status.mjs
          node scripts/select-flashscore-backfill-paths.mjs
      - name: Descobrir épocas e recolher estatísticas + odds Bwin
        env:
          FLASHSCORE_SEASON_PAGE_DELAY_MS: "300"
          FLASHSCORE_REQUEST_DELAY_MS: "200"
          FLASHSCORE_CONCURRENCY: "4"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          completed=0
          failures=0
          blocked=0
          index=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publicar checkpoints com retries para absorver falhas transitórias do GitHub.
          # Se outro processo tiver avançado a main, rebasear o checkpoint antes de tentar novamente.
          push_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=2
            while (( attempt <= max_attempts )); do
              echo "Publicação na main: tentativa $attempt/$max_attempts."
              if git push origin HEAD:main; then
                echo "Checkpoint publicado com sucesso."
                return 0
              fi

              echo "::warning::Push falhou na tentativa $attempt/$max_attempts; a verificar o estado remoto."
              if git fetch origin main; then
                if git merge-base --is-ancestor HEAD origin/main; then
                  echo "O checkpoint já está incluído na main remota."
                  return 0
                fi
                if ! git merge-base --is-ancestor origin/main HEAD; then
                  echo "A main avançou entretanto; a rebasear o checkpoint sobre origin/main."
                  if ! git rebase origin/main; then
                    git rebase --abort || true
                    echo "::error::Não foi possível rebasear o checkpoint sem conflitos."
                    return 1
                  fi
                fi
              else
                echo "::warning::Não foi possível consultar a main remota nesta tentativa."
              fi

              if (( attempt < max_attempts )); then
                echo "Nova tentativa dentro de ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Push falhou após $max_attempts tentativas."
            return 1
          }

          checkpoint() {
            node scripts/validate-flashscore-history.mjs || return 1
            node scripts/integrate-flashscore-odds-history.mjs || return 1
            git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-season-backfill-checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint Flashscore: competição $index" || return 1
              push_with_retry || return 1
            fi
          }
          while IFS= read -r competition_path; do
            [[ -n "$competition_path" ]] || continue
            index=$((index + 1))
            log="/tmp/flashscore-season-$index.log"
            manifest="/tmp/flashscore-season-$index.json"
            echo "::group::Competição $index · $competition_path"
            set +e
            node scripts/discover-flashscore-season.mjs --path="$competition_path" --out="$manifest" 2>&1 | tee "$log" | awk '/^\[SEASON/ { print; fflush() }'
            code=${PIPESTATUS[0]}
            set -e
            if (( code == 0 )); then
              read -r discovered pending already_complete expected < <(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const f=m.fixtures||[]; console.log([f.length,f.filter(x=>x.stats_status!=="already_complete").length,f.filter(x=>x.stats_status==="already_complete").length,m.expected_events||0].join(" "))' "$manifest")
              echo "[COMPETITION] jogos_concluidos=$discovered pendentes=$pending ja_completos=$already_complete eventos_flashscore=$expected"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                printf '\n### Competição %s\n\n- Jogos concluídos descobertos: **%s**\n- Pendentes para recolha: **%s**\n- Já completos e ignorados: **%s**\n- Eventos indicados pelo Flashscore: **%s**\n' "$competition_path" "$discovered" "$pending" "$already_complete" "$expected" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::error::Falha ao descobrir a época de $competition_path (código $code)."
              tail -n 20 "$log"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                printf '\n### Competição %s — falha na descoberta\n\n' "$competition_path" >> "$GITHUB_STEP_SUMMARY"
                grep -Ei 'error|falha|HTTP [0-9]{3}|bloqueou|timeout' "$log" | tail -n 8 >> "$GITHUB_STEP_SUMMARY" || true
              fi
              if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$log"; then
                blocked=1
                echo "Flashscore limitou o acesso; parar o lote para proteger a recolha."
                echo "::endgroup::"
                break
              fi
              failures=$((failures + 1))
              echo "Falha de descoberta nesta competição; avançar para a próxima."
              sleep 2
              echo "::endgroup::"
              continue
            fi
            chunk_dir="/tmp/flashscore-season-chunks-$index"
            if ! node scripts/split-flashscore-season-manifest.mjs --manifest="$manifest" --out-dir="$chunk_dir" --chunk-size=10; then
              echo "::error::Não foi possível dividir o manifesto em blocos retomáveis."
              exit 1
            fi
            competition_failed=0
            shopt -s nullglob
            chunks=("$chunk_dir"/chunk-*.json)
            shopt -u nullglob
            if (( ${#chunks[@]} == 0 )); then echo "Não há jogos pendentes nesta época."; fi
            chunk_index=0
            for chunk in "${chunks[@]}"; do
              chunk_index=$((chunk_index + 1))
              chunk_log="$chunk_dir/chunk-$chunk_index.log"
              echo "[CHECKPOINT BLOCO] $competition_path · bloco $chunk_index/${#chunks[@]} · até 10 jogos"
              set +e
              node scripts/collect-flashscore-csv.mjs --team-last-five="$chunk" 2>&1 | tee "$chunk_log" | awk '/^\[COLLECT\]/ || /^\[PROGRESS\].*\| (OK|ERROR) \|/ || /^\[RETRY\]/ || /^\[SUMMARY\]/ || /^\[MONITOR\]/ { print; fflush() }'
              code=${PIPESTATUS[0]}
              set -e
              ok_count=$(grep -cE '^\[PROGRESS\].*\| OK \|' "$chunk_log" || true)
              error_count=$(grep -cE '^\[PROGRESS\].*\| ERROR \|' "$chunk_log" || true)
              echo "[CHUNK SUMMARY] $competition_path · bloco $chunk_index/${#chunks[@]} · sucesso=$ok_count · falhas=$error_count · exit=$code"
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                printf '\n- Bloco %s/%s: **%s sucessos**, **%s falhas** (exit %s)\n' "$chunk_index" "${#chunks[@]}" "$ok_count" "$error_count" "$code" >> "$GITHUB_STEP_SUMMARY"
              fi
              if (( code != 0 )); then
                tail -n 12 "$chunk_log"
                competition_failed=1
                failures=$((failures + 1))
                if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$chunk_log"; then
                  blocked=1
                  echo "Flashscore limitou a recolha; guardar o bloco válido e parar."
                else
                  echo "Bloco com falhas: jogos bem recolhidos serão guardados; os restantes serão tentados na próxima execução."
                  if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                    grep -Ei 'ERROR|RETRY|HTTP [0-9]{3}|timeout|falha' "$chunk_log" | tail -n 10 >> "$GITHUB_STEP_SUMMARY" || true
                  fi
                fi
              fi
              if ! checkpoint; then
                echo "::error::Falha ao publicar checkpoint após bloco $chunk_index de $competition_path."
                exit 1
              fi
              if (( blocked == 1 )); then break; fi
            done
            if (( competition_failed == 0 && blocked == 0 )); then
              completed=$((completed + 1))
              node --input-type=module - "$competition_path" <<'NODE'
          import fs from "node:fs";
          const file = "data/flashscore-season-backfill-checkpoint.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const path = process.argv[2];
          state.completed_paths = [...new Set([...(state.completed_paths || []), path])].sort();
          state.updated_at = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(state, null, 2) + "\n");
          NODE
              if ! checkpoint; then echo "::error::Falha ao publicar conclusão de $competition_path."; exit 1; fi
            fi
            if (( blocked == 1 )); then
              echo "::endgroup::"
              break
            fi
            sleep 2
            echo "::endgroup::"
          done < /tmp/flashscore-season-paths.txt
          echo "Competições concluídas: $completed"
          echo "Competições com erros: $failures"
          echo "Interrompido por bloqueio: $blocked"
          node scripts/validate-flashscore-history.mjs || exit 1
          node scripts/integrate-flashscore-odds-history.mjs || exit 1
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-season-backfill-checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill Flashscore das épocas atuais" || exit 1
            push_with_retry || exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '\n## Resultado final do backfill\n\n- Competições concluídas: **%s**\n- Competições com erros: **%s**\n- Interrompido por bloqueio: **%s**\n' "$completed" "$failures" "$blocked" >> "$GITHUB_STEP_SUMMARY"
          fi
          if (( blocked == 1 || failures > 0 )); then
            echo "::error::O lote preservou os dados válidos, mas terminou com $failures falhas e bloqueio=$blocked."
            exit 1
          fi
      - name: Guardar logs completos do backfill
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-backfill-logs-${{ github.run_id }}
          path: |
            /tmp/flashscore-season-*.log
            /tmp/flashscore-season-chunks-*/*.log
          if-no-files-found: warn
          retention-days: 14
