name: Backfill Flashscore — continuar desde Turquia
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar e testar descoberta
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
          RESUME_FROM_PATH: ${{ inputs.resume_from_path }}
        run: |
          set -euo pipefail
          if [[ -n "$COMPETITION_PATH" || -n "$RESUME_FROM_PATH" ]]; then
            for candidate in "$COMPETITION_PATH" "$RESUME_FROM_PATH"; do
              [[ -n "$candidate" ]] || continue
              [[ "$candidate" =~ ^/futebol/[a-z0-9-]+/[a-z0-9-]+/$ ]] || {
                echo "Caminho inválido: $candidate. Usa /futebol/<pais>/<competicao>/."
                exit 2
              }
              if [[ "$candidate" =~ friendly|friendlies|amig[aá]v|amistos ]]; then
                echo "Competições amigáveis estão excluídas."
                exit 2
              fi
            done
          fi
          node --check scripts/discover-flashscore-season.mjs
          node --test tests/discover-flashscore-season.test.mjs
      - name: Preparar lista de competições da época atual
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
          RESUME_FROM_PATH: ${{ inputs.resume_from_path }}
          COMPETITION_OFFSET: ${{ inputs.competition_offset }}
          COMPETITION_LIMIT: ${{ inputs.competition_limit }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const requested = process.env.COMPETITION_PATH || "";
          const resumeFrom = process.env.RESUME_FROM_PATH || "";
          const checkpointFile = "data/flashscore-season-backfill-checkpoint.json";
          const checkpoint = JSON.parse(fs.readFileSync(checkpointFile, "utf8"));
          const completedPaths = new Set(checkpoint.completed_paths || []);
          const selection = JSON.parse(fs.readFileSync("data/flashscore-competition-selection.json", "utf8"));
          const selectedPaths = new Set(selection.selected_paths || []);
          if (!selectedPaths.size) throw new Error("Ainda não existem competições selecionadas. Abre competitions.html, escolhe as ligas e guarda a seleção antes de iniciar o backfill.");
          let allPaths;
          if (requested) {
            if (!selectedPaths.has(requested)) throw new Error("A competição pedida não está na seleção ativa: " + requested);
            allPaths = [requested];
          } else {
            const catalog = JSON.parse(fs.readFileSync("data/flashscore-competition-catalog.json", "utf8"));
            allPaths = [...new Set((catalog.competitions || []).map(item => {
              try { return new URL(item.url).pathname; } catch { return ""; }
            }).filter(path =>
              /^\\/futebol\\/[a-z0-9-]+\\/[a-z0-9-]+\\/$/.test(path) &&
              !/friendly|friendlies|amig[aá]v|amistos/i.test(path) &&
              selectedPaths.has(path)
            ))].sort();
          }
          if (!allPaths.length) throw new Error("A seleção não contém caminhos válidos no catálogo atual.");
          if (resumeFrom) {
            const start = allPaths.indexOf(resumeFrom);
            if (start < 0) throw new Error("A competição indicada para retoma não existe no catálogo completo: " + resumeFrom);
            allPaths = allPaths.slice(start);
          }
          const alreadyCompleted = allPaths.filter(path => completedPaths.has(path)).length;
          let paths = requested ? allPaths : allPaths.filter(path => !completedPaths.has(path));
          const offset = Number(process.env.COMPETITION_OFFSET || 0);
          const limit = Number(process.env.COMPETITION_LIMIT || 0);
          if (!Number.isInteger(offset) || offset < 0 || !Number.isInteger(limit) || limit < 0) {
            throw new Error("competition_offset e competition_limit têm de ser inteiros não negativos.");
          }
          const remaining = paths.length;
          paths = paths.slice(offset, limit > 0 ? offset + limit : undefined);
          if (!paths.length) throw new Error("Não há competições pendentes no grupo pedido; catálogo=" + allPaths.length + ", concluídas=" + alreadyCompleted + ".");
          fs.writeFileSync("/tmp/flashscore-season-paths.txt", paths.join("\n") + "\n");
          console.log("Competições selecionadas pelo utilizador: " + selectedPaths.size);\n          console.log("Competições incluídas neste lote: " + allPaths.length);
          console.log("Competições já concluídas e preservadas: " + alreadyCompleted);
          console.log("Competições ainda pendentes antes do offset: " + remaining);
          console.log("Retoma a partir de: " + (requested || resumeFrom || "primeira competição ainda não concluída"));
          console.log("Grupo selecionado: offset=" + offset + ", limite=" + (limit || "todas") + ", selecionadas=" + paths.length);
          console.log("Primeira competição selecionada: " + paths[0]);
          console.log("Última competição selecionada: " + paths[paths.length - 1]);
          console.log("Âmbito: apenas competições explicitamente selecionadas; checkpoint e históricos existentes preservados; amigáveis excluídos.");
          NODE
      - name: Descobrir épocas e recolher estatísticas + odds Bwin
        env:
          FLASHSCORE_SEASON_PAGE_DELAY_MS: "300"
          FLASHSCORE_REQUEST_DELAY_MS: "200"
          FLASHSCORE_CONCURRENCY: "4"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          completed=0
          failures=0
          blocked=0
          index=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publicar checkpoints com retries para absorver falhas transitórias do GitHub.
          # Se outro processo tiver avançado a main, rebasear o checkpoint antes de tentar novamente.
          push_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=2
            while (( attempt <= max_attempts )); do
              echo "Publicação na main: tentativa $attempt/$max_attempts."
              if git push origin HEAD:main; then
                echo "Checkpoint publicado com sucesso."
                return 0
              fi

              echo "::warning::Push falhou na tentativa $attempt/$max_attempts; a verificar o estado remoto."
              if git fetch origin main; then
                if git merge-base --is-ancestor HEAD origin/main; then
                  echo "O checkpoint já está incluído na main remota."
                  return 0
                fi
                if ! git merge-base --is-ancestor origin/main HEAD; then
                  echo "A main avançou entretanto; a rebasear o checkpoint sobre origin/main."
                  if ! git rebase origin/main; then
                    git rebase --abort || true
                    echo "::error::Não foi possível rebasear o checkpoint sem conflitos."
                    return 1
                  fi
                fi
              else
                echo "::warning::Não foi possível consultar a main remota nesta tentativa."
              fi

              if (( attempt < max_attempts )); then
                echo "Nova tentativa dentro de ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Push falhou após $max_attempts tentativas."
            return 1
          }

          checkpoint() {
            node scripts/validate-flashscore-history.mjs || return 1
            node scripts/integrate-flashscore-odds-history.mjs || return 1
            git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-season-backfill-checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint Flashscore: competição $index" || return 1
              push_with_retry || return 1
            fi
          }
          while IFS= read -r competition_path; do
            [[ -n "$competition_path" ]] || continue
            index=$((index + 1))
            log="/tmp/flashscore-season-$index.log"
            manifest="/tmp/flashscore-season-$index.json"
            echo "::group::Competição $index · $competition_path"
            if node scripts/discover-flashscore-season.mjs --path="$competition_path" --out="$manifest" >"$log" 2>&1; then
              cat "$log"
            else
              code=$?
              cat "$log"
              if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$log"; then
                blocked=1
                echo "Flashscore limitou o acesso; parar o lote para proteger a recolha."
                echo "::endgroup::"
                break
              fi
              failures=$((failures + 1))
              echo "Falha de descoberta nesta competição; avançar para a próxima."
              sleep 2
              echo "::endgroup::"
              continue
            fi
            if node scripts/collect-flashscore-csv.mjs --team-last-five="$manifest" >>"$log" 2>&1; then
              cat "$log"
              completed=$((completed + 1))
              node --input-type=module - "$competition_path" <<'NODE'
          import fs from "node:fs";
          const file = "data/flashscore-season-backfill-checkpoint.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const path = process.argv[2];
          state.completed_paths = [...new Set([...(state.completed_paths || []), path])].sort();
          state.updated_at = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(state, null, 2) + "\n");
          NODE
            else
              code=$?
              cat "$log"
              if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$log"; then
                blocked=1
                echo "Flashscore limitou a recolha; guardar o progresso válido e parar o lote."
              else
                failures=$((failures + 1))
                echo "Falha na recolha desta competição; guardar progresso válido e avançar."
              fi
            fi
            if ! checkpoint; then
              echo "::error::Falha ao validar ou guardar checkpoint após $competition_path."
              exit 1
            fi
            if (( blocked == 1 )); then
              echo "::endgroup::"
              break
            fi
            sleep 2
            echo "::endgroup::"
          done < /tmp/flashscore-season-paths.txt
          echo "Competições concluídas: $completed"
          echo "Competições com erros: $failures"
          echo "Interrompido por bloqueio: $blocked"
          node scripts/validate-flashscore-history.mjs || exit 1
          node scripts/integrate-flashscore-odds-history.mjs || exit 1
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-season-backfill-checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill Flashscore das épocas atuais" || exit 1
            push_with_retry || exit 1
          fi
          if (( blocked == 1 || failures > 0 )); then
            echo "::error::O lote preservou os dados válidos, mas terminou com $failures falhas e bloqueio=$blocked."
            exit 1
          fi
