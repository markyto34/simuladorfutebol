              continue
            fi
            chunk_dir="/tmp/flashscore-season-chunks-$index"
            if ! node scripts/split-flashscore-season-manifest.mjs --manifest="$manifest" --out-dir="$chunk_dir" --chunk-size=10; then
              echo "::error::Não foi possível dividir o manifesto em blocos retomáveis."
              exit 1
            fi
            competition_failed=0
            shopt -s nullglob
            chunks=("$chunk_dir"/chunk-*.json)
            shopt -u nullglob
            if (( ${#chunks[@]} == 0 )); then echo "Não há jogos pendentes nesta época."; fi
            chunk_index=0
            for chunk in "${chunks[@]}"; do
              chunk_index=$((chunk_index + 1))
              chunk_log="$chunk_dir/chunk-$chunk_index.log"
              echo "[CHECKPOINT BLOCO] $competition_path · bloco $chunk_index/${#chunks[@]} · até 10 jogos"
              if node scripts/collect-flashscore-csv.mjs --team-last-five="$chunk" >"$chunk_log" 2>&1; then
                cat "$chunk_log"
              else
                code=$?
                cat "$chunk_log"
                competition_failed=1
                failures=$((failures + 1))
                if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$chunk_log"; then
                  blocked=1
                  echo "Flashscore limitou a recolha; guardar o bloco válido e parar."
                else
                  echo "Bloco com falhas: jogos bem recolhidos serão guardados; os restantes serão tentados na próxima execução."
                fi
              fi
              if ! checkpoint; then
                echo "::error::Falha ao publicar checkpoint após bloco $chunk_index de $competition_path."
                exit 1
              fi
              if (( blocked == 1 )); then break; fi
            done
            if (( competition_failed == 0 && blocked == 0 )); then
              completed=$((completed + 1))
              node --input-type=module - "$competition_path" <<'NODE'
          import fs from "node:fs";
          const file = "data/flashscore-season-backfill-checkpoint.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const path = process.argv[2];
          state.completed_paths = [...new Set([...(state.completed_paths || []), path])].sort();
          state.updated_at = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(state, null, 2) + "\n");
          NODE
              if ! checkpoint; then echo "::error::Falha ao publicar conclusão de $competition_path."; exit 1; fi
            fi
            if (( blocked == 1 )); then
              echo "::endgroup::"
              break
            fi
            sleep 2
            echo "::endgroup::"
          done < /tmp/flashscore-season-paths.txt
          echo "Competições concluídas: $completed"
          echo "Competições com erros: $failures"
          echo "Interrompido por bloqueio: $blocked"
          node scripts/validate-flashscore-history.mjs || exit 1
          node scripts/integrate-flashscore-odds-history.mjs || exit 1
          git add data/flashscore-statistics.csv data/bwin-odds-flashscore.csv data/flashscore-season-backfill-checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill Flashscore das épocas atuais" || exit 1
            push_with_retry || exit 1
          fi
          if (( blocked == 1 || failures > 0 )); then
            echo "::error::O lote preservou os dados válidos, mas terminou com $failures falhas e bloqueio=$blocked."
            exit 1
          fi
