name: Descobrir catálogo completo de competições Flashscore

on:
  push:
    branches: [feature/flashscore-full-competition-discovery, main]
    paths:
      - ".github/workflows/discover-flashscore-catalog.yml"
      - "scripts/discover-flashscore-catalog.mjs"
      - "scripts/prepare-flashscore-catalog.mjs"
      - "scripts/audit-flashscore-catalog-coverage.mjs"
      - "tests/discover-flashscore-catalog.test.mjs"
      - "tests/prepare-flashscore-catalog.test.mjs"
      - "tests/audit-flashscore-catalog-coverage.test.mjs"
      - "data/flashscore-statistics.csv"
      - "data/force-flashscore-catalog-discovery.once"

concurrency:
  group: flashscore-catalog-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Verificar se o catálogo permanente já existe
        id: catalog-check
        run: |
          if [ -s data/force-flashscore-catalog-discovery.once ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Pedido de redescoberta única encontrado."
          elif [ -s data/flashscore-competition-catalog.json ] && grep -q '"catalog_discovery_version": "2.0"' data/flashscore-competition-catalog.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Catálogo permanente encontrado; saltar descoberta completa."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Catálogo ainda não existe; executar descoberta inicial."
          fi
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar parser e preparação do catálogo
        run: node --test tests/discover-flashscore-catalog.test.mjs tests/prepare-flashscore-catalog.test.mjs
      - name: Descobrir competições por país
        if: steps.catalog-check.outputs.exists != 'true'
        run: node scripts/discover-flashscore-catalog.mjs
        env:
          FLASHSCORE_CATALOG_WAIT_MS: "700"
      - name: Preparar catálogo e excluir ligações de navegação
        if: steps.catalog-check.outputs.exists != 'true'
        run: node scripts/prepare-flashscore-catalog.mjs
      - name: Cruzar catálogo com estatísticas existentes
        run: node scripts/audit-flashscore-catalog-coverage.mjs
      - name: Guardar catálogo e auditoria permanentemente no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s data/force-flashscore-catalog-discovery.once ]; then
            rm data/force-flashscore-catalog-discovery.once
          fi
          git add data/flashscore-competition-catalog-raw.json data/flashscore-competition-catalog.json data/flashscore-competition-coverage.json
          git add -u data/force-flashscore-catalog-discovery.once 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Catálogo e auditoria já estão atualizados."
          else
            git commit -m "Atualizar auditoria de cobertura Flashscore"
            git push
          fi
      - name: Publicar catálogos e auditoria de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-competition-catalogs
          path: |
            data/flashscore-competition-catalog-raw.json
            data/flashscore-competition-catalog.json
            data/flashscore-competition-coverage.json
          if-no-files-found: error
          retention-days: 30
