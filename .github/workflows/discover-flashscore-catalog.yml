name: Descobrir catálogo completo de competições Flashscore

on:
  push:
    branches: [feature/flashscore-full-competition-discovery, main]
    paths:
      - "scripts/discover-flashscore-catalog.mjs"
      - "scripts/merge-flashscore-catalog-groups.mjs"
      - "scripts/prepare-flashscore-catalog.mjs"
      - "tests/discover-flashscore-catalog.test.mjs"
      - "tests/prepare-flashscore-catalog.test.mjs"
      - "data/force-flashscore-catalog-discovery.once"

concurrency:
  group: flashscore-catalog-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover-groups:
    name: Descoberta grupo ${{ matrix.group_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group_index: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar parser e preparação do catálogo
        run: node --test tests/discover-flashscore-catalog.test.mjs tests/prepare-flashscore-catalog.test.mjs
      - name: Descobrir competições do grupo
        run: |
          mkdir -p data/flashscore-catalog-groups
          node scripts/discover-flashscore-catalog.mjs
        env:
          FLASHSCORE_CATALOG_WAIT_MS: "350"
          FLASHSCORE_CATALOG_GROUP_INDEX: ${{ matrix.group_index }}
          FLASHSCORE_CATALOG_GROUP_SIZE: "30"
          FLASHSCORE_CATALOG_OUTPUT: data/flashscore-catalog-groups/group-${{ matrix.group_index }}.json
      - name: Guardar resultado do grupo
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-catalog-group-${{ matrix.group_index }}
          path: data/flashscore-catalog-groups/group-${{ matrix.group_index }}.json
          if-no-files-found: error
          retention-days: 7

  merge-and-publish:
    name: Consolidar e guardar catálogo
    needs: discover-groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descarregar todos os grupos
        uses: actions/download-artifact@v4
        with:
          pattern: flashscore-catalog-group-*
          path: data/flashscore-catalog-groups
          merge-multiple: true
      - name: Consolidar grupos e validar cobertura
        run: |
          node scripts/merge-flashscore-catalog-groups.mjs
          node scripts/prepare-flashscore-catalog.mjs
          node scripts/audit-flashscore-catalog-coverage.mjs
      - name: Guardar catálogo e auditoria permanentemente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s data/force-flashscore-catalog-discovery.once ]; then
            rm data/force-flashscore-catalog-discovery.once
          fi
          git add data/flashscore-competition-catalog-raw.json data/flashscore-competition-catalog.json data/flashscore-competition-coverage.json
          git add -u data/force-flashscore-catalog-discovery.once 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Catálogo e auditoria já estão atualizados."
          else
            git commit -m "Guardar catálogo Flashscore descoberto por grupos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publicar catálogos e auditoria
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-competition-catalogs
          path: |
            data/flashscore-competition-catalog-raw.json
            data/flashscore-competition-catalog.json
            data/flashscore-competition-coverage.json
          if-no-files-found: error
          retention-days: 30
