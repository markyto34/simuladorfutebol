name: Recuperar resultados em falta (sem duplicar jogos)

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-flashscore-scores.mjs"
      - "tests/backfill-flashscore-scores.test.mjs"
      - ".github/workflows/backfill-flashscore-scores.yml"

permissions:
  contents: write

concurrency:
  group: backfill-flashscore-scores
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar script e testes
        run: |
          node --check scripts/backfill-flashscore-scores.mjs
          node --test tests/backfill-flashscore-scores.test.mjs
      - name: Preencher resultados dos jogos já existentes
        run: node scripts/backfill-flashscore-scores.mjs --apply
      - name: Validar CSV histórico
        run: node scripts/validate-flashscore-history.mjs
      - name: Guardar apenas campos recuperados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/flashscore-statistics.csv
          if git diff --cached --quiet; then
            echo "Sem resultados adicionais para guardar."
          else
            git commit -m "Completar resultados em registos Flashscore existentes"
            git push origin HEAD:main
          fi
