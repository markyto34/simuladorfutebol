name: Testes do simulador
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check csv-odds-core.js
      - run: node --check csv-odds-app.js
      - run: node --check config.js
      - run: node --check monitor.js
      - run: node --check windrawwin-proxy/src/index.js
      - run: node --check flashscore-proxy/src/index.js
      - run: node --check scripts/collect-flashscore-csv.mjs
      - run: node --check scripts/validate-flashscore-history.mjs
      - run: node scripts/validate-config.cjs
      - run: node --test tests/*.test.cjs
      - run: node --test tests/*.test.mjs
      - run: node --check flashscore-proxy/src/extract-page-context.mjs
      - run: node --check flashscore-proxy/src/extract-match-record.mjs
