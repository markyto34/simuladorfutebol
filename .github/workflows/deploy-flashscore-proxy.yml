name: Deploy Flashscore proxy

on:
  push:
    branches: [main]
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  pull_request:
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Worker syntax
        run: |
          node --check flashscore-proxy/src/index.js
          node --check scripts/collect-flashscore-csv.mjs
          node --check flashscore-proxy/src/discover-matches.mjs
          node --check flashscore-proxy/src/match-tabs.mjs
      - name: Test Flashscore extractors
        run: node --test tests/*.test.cjs tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashscore-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure collection monitor secret
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${MONITOR_TOKEN:-}" ]; then
            printf '%s' "$MONITOR_TOKEN" | npx wrangler secret put MONITOR_TOKEN
          else
            echo "MONITOR_TOKEN não configurado; monitorização ficará inativa."
          fi

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: flashscore-proxy
