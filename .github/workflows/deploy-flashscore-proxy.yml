name: Deploy Flashscore proxy

on:
  push:
    branches: [main]
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  pull_request:
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Worker syntax
        run: |
          node --check flashscore-proxy/src/index.js
          node --check scripts/collect-flashscore-csv.mjs
          node --check flashscore-proxy/src/discover-matches.mjs
          node --check flashscore-proxy/src/match-tabs.mjs
          node --check flashscore-proxy/src/team-results.mjs
      - name: Build Worker bundle (dry run)
        run: cd flashscore-proxy && npx --yes wrangler@4 deploy --dry-run
      - name: Test Flashscore extractors
        run: node --test tests/*.test.cjs tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashscore-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: flashscore-proxy
      - name: Smoke test team results endpoint
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/health" -o /tmp/proxy-health.json
          team_code=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' "$PROXY_URL/team-inspect?id=tljXuHBC" -o /tmp/team-results.json)
          echo "team-inspect HTTP status: $team_code"
          cat /tmp/team-results.json
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/inspect?id=QXNphZjA&summary=1" -o /tmp/match-inspect.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/team-results.json","utf8")); const rows=d.latest_finished_matches||[]; if(!d.ok || d.team_id!=="tljXuHBC" || rows.length!==5 || rows.some(m=>m.home.id!=="tljXuHBC" && m.away.id!=="tljXuHBC")) { console.error(JSON.stringify(d)); process.exit(1); } console.log(JSON.stringify({team_id:d.team_id,event_count:d.event_count,finished_count:d.finished_count,latest_finished_matches:rows.map(m=>({match_id:m.match_id,date:m.start_time_iso,home:m.home.name,home_score:m.home.score,away:m.away.name,away_score:m.away.score,competition:m.competition}))}));'
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/match-inspect.json","utf8")); const teams=d.inspection?.team_links||[]; if(!d.ok || teams.length<2 || !teams.some(t=>t.team_id==="tljXuHBC")) { console.error(JSON.stringify(d)); process.exit(1); } console.log(JSON.stringify({match_id:d.match_id,team_links:teams}));'
      - name: Smoke test cantos HT e ST do feed Flashscore
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/record?id=hW5lOaOP&tab=statistics" -o /tmp/period-corners.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/period-corners.json","utf8")); const r=d.record||{}; const ht=r.statistics?.corners_ht; const st=r.statistics?.corners_st; const status=r.period_statistics_feed?.status; if(!d.ok || status!=="available" || !ht || !st || ![ht.home,ht.away,st.home,st.away].every(Number.isFinite)) { console.error(JSON.stringify({ok:d.ok,status,feed:r.period_statistics_feed,corners_ht:ht,corners_st:st})); process.exit(1); } console.log(JSON.stringify({match_id:d.match_id,feed_status:status,corners_ht:{home:ht.home,away:ht.away},corners_st:{home:st.home,away:st.away}}));'
      - name: Smoke test golos HT e ST reais do Flashscore
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          # Jogo concluído recente: Shakhtar Donetsk - Sporting CP (03/11/2026).
          # O teste valida HT/ST reais e confirma que a soma coincide com o FT.
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/record?id=QXNphZjA&tab=statistics" -o /tmp/period-goals.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/period-goals.json","utf8")); const s=d.record?.score||{}; const ht=s.half_time; const st=s.second_half; const ft=s.full_time; const valid=x=>x&&Number.isInteger(x.home)&&Number.isInteger(x.away)&&x.home>=0&&x.away>=0; if(!d.ok||!valid(ht)||!valid(st)||!valid(ft)||ht.home+st.home!==ft.home||ht.away+st.away!==ft.away){console.error(JSON.stringify({ok:d.ok,match_id:d.match_id,status:d.record?.status,score:s,missing_fields:d.record?.missing_fields}));process.exit(1);} const outcome=x=>x.home>x.away?"vitória da equipa da casa":x.home<x.away?"vitória da equipa visitante":"empate"; console.log(JSON.stringify({match_id:d.match_id,status:d.record.status,half_time:ht,half_time_outcome:outcome(ht),second_half:st,second_half_outcome:outcome(st),full_time:ft,validation:"HT + ST = FT"}));'
      - name: Smoke test descoberta real de jogos e nomes das equipas
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          discovery_date=$(TZ=Europe/Lisbon date +%F)
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/discover-inspect?date=$discovery_date&ids=1" -o /tmp/discovery.json
          if node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery.json","utf8")); const i=d.inspection||{}; const fixtures=i.match_fixtures||{}; const ids=i.match_ids||[]; const rows=Object.entries(fixtures); console.log(JSON.stringify({date:i.requested_date,match_count:i.match_count,ids:ids.length,fixtures:rows.length})); if(!d.ok || !ids.length || !rows.length) process.exit(2); const invalid=rows.filter(([id,t])=>!ids.includes(id)||!t?.home||!t?.away); if(invalid.length) { console.error(JSON.stringify({invalid})); process.exit(1); } console.log(JSON.stringify({date:i.requested_date,discovered_match_ids:ids.length,fixtures_with_both_teams:rows.length,sample:rows.slice(0,5)}));'; then
            echo "Descoberta de jogos e equipas validada."
          else
            discovery_status=$?
            if [ "$discovery_status" -eq 2 ]; then
            echo "Sem equipas extraídas. A recolher amostra HTML/âncoras para diagnóstico."
            curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/discover-inspect?date=$discovery_date&summary=1" -o /tmp/discovery-summary.json
            node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery-summary.json","utf8")); console.log("DIAGNÓSTICO DA PÁGINA REAL:"); console.log(JSON.stringify(d.inspection||d));'
            sample_id=$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery-summary.json","utf8")); process.stdout.write(d.inspection?.sample_matches?.[0]?.match_id || "")')
            if [ -n "$sample_id" ]; then
              echo "A recolher HTML em redor do jogo $sample_id"
              curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/discover-inspect?date=$discovery_date&match_id=$sample_id" -o /tmp/discovery-context.json
              node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery-context.json","utf8")); const i=d.inspection||{}; console.log("CONTEXTO HTML DO PRIMEIRO JOGO:"); console.log(JSON.stringify({target_match_id:i.target_match_id,matches:i.matches?.map(m=>({match_id:m.match_id,href:m.href,anchor_text:m.anchor_text,context:m.context,context_html:m.context_html}))}));'
            fi
              exit 1
            else
              exit "$discovery_status"
            fi
          fi