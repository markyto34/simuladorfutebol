name: Deploy Flashscore proxy

on:
  push:
    branches: [main]
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  pull_request:
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Worker syntax
        run: |
          node --check flashscore-proxy/src/index.js
          node --check scripts/collect-flashscore-csv.mjs
          node --check flashscore-proxy/src/discover-matches.mjs
          node --check flashscore-proxy/src/match-tabs.mjs
          node --check flashscore-proxy/src/team-results.mjs
      - name: Build Worker bundle (dry run)
        run: cd flashscore-proxy && npx --yes wrangler@4 deploy --dry-run
      - name: Test Flashscore extractors
        run: node --test tests/*.test.cjs tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashscore-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: flashscore-proxy
      - name: Smoke test team results endpoint
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/health" -o /tmp/proxy-health.json
          team_code=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' "$PROXY_URL/team-inspect?id=tljXuHBC" -o /tmp/team-results.json)
          echo "team-inspect HTTP status: $team_code"
          cat /tmp/team-results.json
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/inspect?id=QXNphZjA&summary=1" -o /tmp/match-inspect.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/team-results.json","utf8")); const rows=d.latest_finished_matches||[]; if(!d.ok || d.team_id!=="tljXuHBC" || rows.length!==5 || rows.some(m=>m.home.id!=="tljXuHBC" && m.away.id!=="tljXuHBC")) { console.error(JSON.stringify(d)); process.exit(1); } console.log(JSON.stringify({team_id:d.team_id,event_count:d.event_count,finished_count:d.finished_count,latest_finished_matches:rows.map(m=>({match_id:m.match_id,date:m.start_time_iso,home:m.home.name,home_score:m.home.score,away:m.away.name,away_score:m.away.score,competition:m.competition}))}));'
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/match-inspect.json","utf8")); const teams=d.inspection?.team_links||[]; if(!d.ok || teams.length<2 || !teams.some(t=>t.team_id==="tljXuHBC")) { console.error(JSON.stringify(d)); process.exit(1); } console.log(JSON.stringify({match_id:d.match_id,team_links:teams}));'
      - name: Smoke test descoberta real de jogos e nomes das equipas
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          discovery_date=$(TZ=Europe/Lisbon date +%F)
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/discover-inspect?date=$discovery_date&ids=1" -o /tmp/discovery.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery.json","utf8")); const i=d.inspection||{}; const fixtures=i.match_fixtures||{}; const ids=i.match_ids||[]; const rows=Object.entries(fixtures); console.log(JSON.stringify({date:i.requested_date,match_count:i.match_count,ids:ids.length,fixtures:rows.length})); if(!d.ok || !ids.length || !rows.length) process.exit(2); const invalid=rows.filter(([id,t])=>!ids.includes(id)||!t?.home||!t?.away); if(invalid.length) { console.error(JSON.stringify({invalid})); process.exit(1); } console.log(JSON.stringify({date:i.requested_date,discovered_match_ids:ids.length,fixtures_with_both_teams:rows.length,sample:rows.slice(0,5)}));'
          discovery_status=$?
          if [ "$discovery_status" -eq 2 ]; then
            echo "Sem equipas extraídas. A recolher amostra HTML/âncoras para diagnóstico."
            curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 2 "$PROXY_URL/discover-inspect?date=$discovery_date&summary=1" -o /tmp/discovery-summary.json
            node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/discovery-summary.json","utf8")); console.log("DIAGNÓSTICO DA PÁGINA REAL:"); console.log(JSON.stringify(d.inspection||d));'
            exit 1
          elif [ "$discovery_status" -ne 0 ]; then
            exit "$discovery_status"
          fi
