name: Deploy Flashscore proxy

on:
  push:
    branches: [main]
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  pull_request:
    paths:
      - "flashscore-proxy/**"
      - ".github/workflows/deploy-flashscore-proxy.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Worker syntax
        run: |
          node --check flashscore-proxy/src/index.js
          node --check scripts/collect-flashscore-csv.mjs
          node --check flashscore-proxy/src/discover-matches.mjs
          node --check flashscore-proxy/src/match-tabs.mjs
          node --check flashscore-proxy/src/team-results.mjs
      - name: Build Worker bundle (dry run)
        run: cd flashscore-proxy && npx --yes wrangler@4 deploy --dry-run
      - name: Test Flashscore extractors
        run: node --test tests/*.test.cjs tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashscore-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: flashscore-proxy
      - name: Smoke test team results endpoint
        env:
          PROXY_URL: https://simuladorfutebol-flashscore-proxy.marcolourenco2024.workers.dev
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/health" -o /tmp/proxy-health.json
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$PROXY_URL/team-inspect?id=tljXuHBC" -o /tmp/team-results.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/team-results.json","utf8")); const rows=d.latest_finished_matches||[]; if(!d.ok || d.team_id!=="tljXuHBC" || rows.length!==5 || rows.some(m=>m.home.id!=="tljXuHBC" && m.away.id!=="tljXuHBC")) { console.error(JSON.stringify(d)); process.exit(1); } console.log(JSON.stringify({team_id:d.team_id,event_count:d.event_count,finished_count:d.finished_count,latest_finished_matches:rows.map(m=>({match_id:m.match_id,date:m.start_time_iso,home:m.home.name,home_score:m.home.score,away:m.away.name,away_score:m.away.score,competition:m.competition}))}));'
