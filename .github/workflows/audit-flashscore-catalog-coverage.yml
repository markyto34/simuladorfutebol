name: Atualizar auditoria de cobertura do catálogo Flashscore

on:
  push:
    branches: [feature/flashscore-full-competition-discovery, main]
    paths:
      - ".github/workflows/audit-flashscore-catalog-coverage.yml"
      - "scripts/audit-flashscore-catalog-coverage.mjs"
      - "data/flashscore-statistics.csv"
      - "data/flashscore-competition-catalog.json"

concurrency:
  group: flashscore-catalog-coverage-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    name: Auditar cobertura por competição e indicador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar auditoria
        run: node --test tests/audit-flashscore-catalog-coverage.test.mjs
      - name: Gerar auditoria atualizada
        run: node scripts/audit-flashscore-catalog-coverage.mjs
      - name: Guardar auditoria permanentemente
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashscore-competition-coverage.json
          if git diff --cached --quiet; then
            echo "A auditoria de cobertura já está atualizada."
          else
            git commit -m "Atualizar auditoria de cobertura Flashscore"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
