name: Validar CSV de Odds
on:
  push:
    branches:
      - feature/csv-odds-lab
    paths:
      - '.github/workflows/validate-csv-odds.yml'
      - 'scripts/validate-csv-odds.cjs'
      - 'csv-odds-core.js'
      - 'ganhonasodds_com_20261101.csv'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-csv-odds.yml'
      - 'scripts/validate-csv-odds.cjs'
      - 'csv-odds-core.js'
      - 'ganhonasodds_com_20261101.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Validar ficheiro completo com o mesmo motor usado na página
        run: node scripts/validate-csv-odds.cjs
      - name: Guardar relatório técnico
        uses: actions/upload-artifact@v4
        with:
          name: csv-odds-validation
          path: csv-odds-validation.json
