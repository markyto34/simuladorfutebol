name: Validate simulator JavaScript

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "data-enrichment.js"
      - ".github/workflows/validate-simulator.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data-enrichment.js
