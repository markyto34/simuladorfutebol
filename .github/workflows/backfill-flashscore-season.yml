name: Backfill Flashscore por época
on:
  workflow_dispatch:
    inputs:
      competition_path:
        description: "Opcional: executar apenas uma competição específica."
        required: false
        type: string
      resume_after_path:
        description: "Retomar depois deste caminho (cursor exclusivo); vazio = primeira pendente."
        required: false
        type: string
      competition_limit:
        description: "Primeiro lote da recolha automática; aumenta 15 após cada lote concluído."
        required: false
        default: "10"
        type: string
permissions:
  contents: write
concurrency:
  group: recolha-diaria-flashscore
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar seleção e testar descoberta
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
        run: |
          set -euo pipefail
          if [[ -n "$COMPETITION_PATH" ]]; then
            [[ "$COMPETITION_PATH" =~ ^/futebol/[a-z0-9-]+/[a-z0-9-]+/$ ]] || {
              echo "Caminho inválido. Usa /futebol/<pais>/<competicao>/."
              exit 2
            }
            if [[ "$COMPETITION_PATH" =~ friendly|friendlies|amig[aá]v|amistos ]]; then
              echo "Competições amigáveis estão excluídas."
              exit 2
            fi
          fi
          node --check scripts/discover-flashscore-season.mjs
          node --check scripts/select-flashscore-backfill-paths.mjs
          node --check scripts/collect-flashscore-csv.mjs
          node --check scripts/publish-flashscore-backfill-progress.mjs
          node --check scripts/validate-flashscore-selected-competition.mjs
          node --test tests/discover-flashscore-season.test.mjs tests/select-flashscore-backfill-paths.test.mjs tests/validate-flashscore-selected-competition.test.mjs
      - name: Preparar competições selecionadas ainda pendentes
        env:
          COMPETITION_PATH: ${{ inputs.competition_path }}
          RESUME_AFTER_PATH: ${{ inputs.resume_after_path }}
          COMPETITION_LIMIT: ${{ inputs.competition_limit }}
        run: |
          set -euo pipefail
          node scripts/build-flashscore-competition-status.mjs
          COMPETITION_PATH="$COMPETITION_PATH" \
          RESUME_AFTER_PATH="$RESUME_AFTER_PATH" \
          COMPETITION_LIMIT="$COMPETITION_LIMIT" \
            node scripts/select-flashscore-backfill-paths.mjs
          echo "Lista selecionada pelo catálogo + seleção ativa + checkpoint:"
          cat /tmp/flashscore-season-paths.txt
      - name: Descobrir épocas e recolher estatísticas dos indicadores do simulador
        env:
          FLASHSCORE_SEASON_PAGE_DELAY_MS: "1500"
          FLASHSCORE_REQUEST_DELAY_MS: "1000"
          FLASHSCORE_CONCURRENCY: "2"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPETITION_LIMIT: ${{ inputs.competition_limit }}
          INPUT_COMPETITION_PATH: ${{ inputs.competition_path }}
        run: |
          set -uo pipefail
          completed=0
          failures=0
          blocked=0
          index=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          selected_paths_json="$(node -e 'const fs=require("node:fs"); console.log(JSON.stringify(fs.readFileSync("/tmp/flashscore-season-paths.txt","utf8").split(/\r?\n/).filter(Boolean)))')"
          total_paths="$(node -e 'const fs=require("node:fs"); console.log(fs.readFileSync("/tmp/flashscore-season-paths.txt","utf8").split(/\r?\n/).filter(Boolean).length)')"
          failed_paths=()
          batch_limit="${COMPETITION_LIMIT:-10}"
          auto_chain=true
          if [[ -n "$INPUT_COMPETITION_PATH" ]]; then auto_chain=false; fi

          publish_progress() {
            local phase="$1" status="$2" competition_path="$3" reset_games="${4:-false}" blocked_state="${5:-false}"
            local failed_paths_json patch
            failed_paths_json="$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${failed_paths[@]}")"
            patch="$(PHASE="$phase" STATUS="$status" CURRENT_COMPETITION_PATH="$competition_path" RESET_GAMES="$reset_games" BLOCKED_STATE="$blocked_state" SELECTED_PATHS_JSON="$selected_paths_json" FAILED_PATHS_JSON="$failed_paths_json" TOTAL_PATHS="$total_paths" COMPETITION_INDEX="$index" COMPLETED_COUNT="$completed" FAILURE_COUNT="$failures" node -e '
              const reset = process.env.RESET_GAMES === "true";
              const patch = {
                run_id: process.env.GITHUB_RUN_ID,
                run_number: process.env.GITHUB_RUN_NUMBER,
                collection_type: "season_backfill",
                status: process.env.STATUS,
                phase: process.env.PHASE,
                selected_competitions: JSON.parse(process.env.SELECTED_PATHS_JSON || "[]"),
                total_competitions: Number(process.env.TOTAL_PATHS || 0),
                competition_index: Number(process.env.COMPETITION_INDEX || 0),
                current_competition_path: process.env.CURRENT_COMPETITION_PATH || "",
                competitions_completed: Number(process.env.COMPLETED_COUNT || 0),
                competitions_failed: Number(process.env.FAILURE_COUNT || 0),
                failed_competitions: JSON.parse(process.env.FAILED_PATHS_JSON || "[]"),
                blocked: process.env.BLOCKED_STATE === "true"
              };
              if (reset) Object.assign(patch, { total_games: 0, processed_games: 0, stats_games: 0, bwin_odds: 0, failed_games: 0, current_match: "A preparar competição", last_result: "" });
              console.log(JSON.stringify(patch));
            ')"
            if ! FLASHSCORE_BACKFILL_PROGRESS_PATCH="$patch" node scripts/publish-flashscore-backfill-progress.mjs; then
              echo "::warning::Não foi possível publicar o estado do monitor; a recolha continua."
            fi
          }

          publish_progress "queued" "running" "" true false

          push_with_retry() {
            local attempt=1 max_attempts=5 delay=2
            while (( attempt <= max_attempts )); do
              echo "Publicação na main: tentativa $attempt/$max_attempts."
              if git push origin HEAD:main; then return 0; fi
              if git fetch origin main; then
                if git merge-base --is-ancestor HEAD origin/main; then return 0; fi
                if ! git merge-base --is-ancestor origin/main HEAD; then
                  if ! git rebase origin/main; then
                    git rebase --abort || true
                    echo "::error::Não foi possível rebasear o checkpoint sem conflitos."
                    return 1
                  fi
                fi
              fi
              if (( attempt < max_attempts )); then sleep "$delay"; delay=$((delay * 2)); fi
              attempt=$((attempt + 1))
            done
            echo "::error::Push falhou após $max_attempts tentativas."
            return 1
          }

          save_checkpoint() {
            local competition_path="$1"
            local mark_completed="$2"
            node scripts/validate-flashscore-history.mjs || return 1
            if [[ "$mark_completed" == "true" ]]; then
              node --input-type=module - "$competition_path" <<'NODE'
          import fs from "node:fs";
          const path = process.argv[2];
          const file = "data/flashscore-season-backfill-checkpoint.json";
          let checkpoint = { version: 1, completed_paths: [] };
          try { checkpoint = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          const completed = new Set(Array.isArray(checkpoint.completed_paths) ? checkpoint.completed_paths : []);
          completed.add(path);
          checkpoint.version = 1;
          checkpoint.completed_paths = [...completed].sort();
          checkpoint.updated_at = new Date().toISOString();
          checkpoint.last_completed_path = path;
          checkpoint.note = "Só contém competições cuja descoberta e recolha terminaram sem erros.";
          fs.writeFileSync(file, JSON.stringify(checkpoint, null, 2) + "\n");
          NODE
            fi
            node scripts/build-flashscore-competition-status.mjs || return 1
            git add data/flashscore-statistics.csv data/flashscore-season-backfill-checkpoint.json data/flashscore-competition-status.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint Flashscore: $competition_path" || return 1
              push_with_retry || return 1
            fi
          }

          while true; do
          while IFS= read -r competition_path; do
            [[ -n "$competition_path" ]] || continue
            index=$((index + 1))
            log="/tmp/flashscore-season-$index.log"
            manifest="/tmp/flashscore-season-$index.json"
            collect_success=false
            echo "::group::Competição $index · $competition_path"
            publish_progress "discovery" "running" "$competition_path" true false
            if ! node scripts/discover-flashscore-season.mjs --path="$competition_path" --out="$manifest" >"$log" 2>&1; then
              cat "$log"
              if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$log"; then
                blocked=1
                failed_paths+=("$competition_path")
                publish_progress "stopped" "blocked" "$competition_path" false true
                echo "Flashscore limitou o acesso; parar o lote."
                echo "::endgroup::"
                break
              fi
              failures=$((failures + 1))
              failed_paths+=("$competition_path")
              publish_progress "failed" "running" "$competition_path" false false
              echo "Falha na descoberta; permanece pendente para retoma."
              echo "::endgroup::"
              continue
            fi
            cat "$log"
            if FLASHSCORE_PROGRESS_PATH="monitor/season-backfill-progress.json" \
              FLASHSCORE_COLLECTION_TYPE="season_backfill" \
              FLASHSCORE_BACKFILL_COMPETITION_PATH="$competition_path" \
              FLASHSCORE_BACKFILL_COMPETITION_INDEX="$index" \
              FLASHSCORE_BACKFILL_COMPETITION_TOTAL="$total_paths" \
              FLASHSCORE_BACKFILL_SELECTED_PATHS_JSON="$selected_paths_json" \
              FLASHSCORE_BACKFILL_COMPLETED="$completed" \
              FLASHSCORE_BACKFILL_FAILURES="$failures" \
              FLASHSCORE_BACKFILL_FAILED_PATHS_JSON="$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${failed_paths[@]}")" \
              node scripts/collect-flashscore-csv.mjs --stats-only --team-last-five="$manifest" >>"$log" 2>&1 && \
              node scripts/validate-flashscore-selected-competition.mjs "$manifest" >>"$log" 2>&1; then
              cat "$log"
              collect_success=true
            else
              cat "$log"
              failures=$((failures + 1))
              failed_paths+=("$competition_path")
              if grep -Eiq 'HTTP (401|403|429)|bloqueou/limitou|Flashscore bloqueou' "$log"; then
                blocked=1
                echo "Flashscore limitou a recolha; guardar dados válidos e parar."
              else
                echo "Recolha incompleta; guardar dados válidos sem marcar a competição como concluída."
              fi
            fi
            publish_progress "saving" "running" "$competition_path" false "$blocked"
            if ! save_checkpoint "$competition_path" "$collect_success"; then
              echo "::error::Falha ao validar ou publicar o checkpoint após $competition_path."
              exit 1
            fi
            if [[ "$collect_success" == "true" ]]; then
              completed=$((completed + 1))
            fi
            publish_progress "collecting" "running" "$competition_path" false "$blocked"
            echo "::endgroup::"
            if (( blocked == 1 )); then break; fi
            sleep 3
          done < /tmp/flashscore-season-paths.txt

            # Só avança quando o lote inteiro termina sem falhas nem bloqueios.
            if (( blocked == 1 || failures > 0 )) || [[ "$auto_chain" != "true" ]]; then break; fi
            batch_limit=$((batch_limit + 15))
            node scripts/build-flashscore-competition-status.mjs
            if ! COMPETITION_PATH="" RESUME_AFTER_PATH="" COMPETITION_LIMIT="$batch_limit" node scripts/select-flashscore-backfill-paths.mjs > /tmp/flashscore-next-batch.log 2>&1; then
              if grep -q "Não existem competições pendentes" /tmp/flashscore-next-batch.log; then
                echo "Todas as competições selecionadas já estão concluídas."
                break
              fi
              cat /tmp/flashscore-next-batch.log
              echo "::error::Não foi possível preparar o lote seguinte."
              failures=$((failures + 1))
              break
            fi
            cat /tmp/flashscore-next-batch.log
            batch_paths="$(node -e 'const fs=require("node:fs"); console.log(fs.readFileSync("/tmp/flashscore-season-paths.txt","utf8").split(/\r?\n/).filter(Boolean).length)')"
            if (( batch_paths == 0 )); then echo "Não existem mais competições pendentes."; break; fi
            selected_paths_json="$(node -e 'const fs=require("node:fs"); console.log(JSON.stringify(fs.readFileSync("/tmp/flashscore-season-paths.txt","utf8").split(/\r?\n/).filter(Boolean)))')"
            total_paths=$((total_paths + batch_paths))
            echo "Próximo lote preparado: máximo $batch_limit; competições selecionadas: $batch_paths."
          done

          final_phase="completed"
          final_status="completed"
          if (( blocked == 1 )); then final_phase="stopped"; final_status="blocked"
          elif (( failures > 0 )); then final_phase="failed"; final_status="failed"
          fi
          publish_progress "$final_phase" "$final_status" "${competition_path:-}" false "$blocked"
          echo "Competições concluídas nesta execução: $completed"
          echo "Competições com erros: $failures"
          echo "Interrompido por bloqueio: $blocked"
          if (( blocked == 1 || failures > 0 )); then
            echo "::error::O lote preservou os dados válidos, mas terminou com $failures falhas e bloqueio=$blocked. As competições incompletas continuam pendentes."
            exit 1
          fi
