name: Atualizar competições completas do simulador
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/flashscore-statistics.csv"
  workflow_run:
    workflows:
      - "Backfill Flashscore por época"
      - "Recolha diária Flashscore + Bwin"
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: simulator-index-refresh
  cancel-in-progress: false
jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter a versão mais recente da recolha
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar script e testes
        run: |
          set -euo pipefail
          node --check scripts/update-simulator-complete-competitions.mjs
          node --test tests/update-simulator-complete-competitions.test.mjs
      - name: Atualizar índice apenas com dados comprovados
        run: node scripts/update-simulator-complete-competitions.mjs
      - name: Publicar índice atualizado sem tocar na recolha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simulator-complete-competitions.json
          if git diff --cached --quiet; then
            echo "O índice já está atualizado; não há novas alterações."
            exit 0
          fi
          git commit -m "Atualizar índice de competições completas"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Índice atualizado na main; o Render fará o deploy automático."
              exit 0
            fi
            echo "Push concorrente; atualizar a main e repetir (tentativa $attempt/5)."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "::error::Não foi possível publicar o índice após cinco tentativas."
          exit 1
